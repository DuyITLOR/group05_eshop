<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #121826; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>

    <!-- Filters for clean shadow effect -->
    <filter id="box-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= TOP-LEFT: PENDING ================= -->
  <g filter="url(#box-shadow)">
    <rect x="60" y="60" width="200" height="65" rx="8" fill="#fdba74" stroke="#ea580c" stroke-width="2.2"/>
    <text x="160" y="88" fill="#7c2d12" font-size="16" font-weight="800" text-anchor="middle">pending</text>
    <text x="160" y="108" fill="#7c2d12" font-size="12" font-weight="700" text-anchor="middle">(Chờ xác nhận)</text>
  </g>

  <!-- Arrow: pending -> confirmed -->
  <line x1="260" y1="92" x2="365" y2="92" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="312" y="82" fill="#fed7aa" font-size="12" font-weight="700" text-anchor="middle">Confirm</text>

  <!-- ================= TOP-CENTER: CONFIRMED ================= -->
  <g filter="url(#box-shadow)">
    <rect x="375" y="60" width="200" height="65" rx="8" fill="#fdba74" stroke="#ea580c" stroke-width="2.2"/>
    <text x="475" y="88" fill="#7c2d12" font-size="16" font-weight="800" text-anchor="middle">confirmed</text>
    <text x="475" y="108" fill="#7c2d12" font-size="12" font-weight="700" text-anchor="middle">(Đã xác nhận)</text>
  </g>

  <!-- Arrow: confirmed -> shipping -->
  <line x1="575" y1="92" x2="685" y2="92" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="630" y="82" fill="#fed7aa" font-size="12" font-weight="700" text-anchor="middle">Ship</text>

  <!-- ================= TOP-RIGHT: SHIPPING ================= -->
  <g filter="url(#box-shadow)">
    <rect x="695" y="60" width="200" height="65" rx="8" fill="#fdba74" stroke="#ea580c" stroke-width="2.2"/>
    <text x="795" y="88" fill="#7c2d12" font-size="16" font-weight="800" text-anchor="middle">shipping</text>
    <text x="795" y="108" fill="#7c2d12" font-size="12" font-weight="700" text-anchor="middle">(Đang giao hàng)</text>
  </g>

  <!-- Arrow: shipping -> delivered -->
  <path d="M 740 125 C 700 240, 480 340, 375 440" fill="none" stroke="#38bdf8" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <text x="610" y="270" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Deliver</text>

  <!-- Arrow: pending -> canceled -->
  <path d="M 160 125 C 160 260, 480 280, 685 460" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="240" y="230" fill="#fda4af" font-size="12" font-weight="700">Cancel</text>

  <!-- Arrow: confirmed -> canceled -->
  <line x1="490" y1="125" x2="720" y2="445" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="590" y="210" fill="#fda4af" font-size="12" font-weight="700">Cancel</text>

  <!-- Arrow: shipping -> canceled -->
  <line x1="820" y1="125" x2="820" y2="440" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="830" y="290" fill="#fda4af" font-size="12" font-weight="700">Cancel</text>

  <!-- ================= BOTTOM-LEFT: DELIVERED (FINAL STATE) ================= -->
  <g filter="url(#box-shadow)">
    <rect x="80" y="445" width="320" height="90" rx="10" fill="#93c5fd" stroke="#2563eb" stroke-width="2.8"/>
    <text x="240" y="482" fill="#1e3a8a" font-size="20" font-weight="900" text-anchor="middle">delivered</text>
    <text x="240" y="506" fill="#1e3a8a" font-size="14" font-weight="800" text-anchor="middle">[Final State: 200 OK]</text>
    <text x="240" y="524" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Giao hàng thành công (Bất biến)</text>
  </g>

  <!-- ================= BOTTOM-RIGHT: CANCELED (FINAL STATE) ================= -->
  <g filter="url(#box-shadow)">
    <rect x="650" y="445" width="260" height="90" rx="10" fill="#ea580c" stroke="#c2410c" stroke-width="2.8"/>
    <text x="780" y="482" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">canceled</text>
    <text x="780" y="506" fill="#fed7aa" font-size="14" font-weight="800" text-anchor="middle">[Final State: 200 OK]</text>
    <text x="780" y="524" fill="#fed7aa" font-size="11" font-weight="600" text-anchor="middle">Đơn hàng đã hủy (Bất biến)</text>
  </g>

  <!-- BUG-ORD-01: Illegal Transition from canceled to delivered -->
  <path d="M 650 510 C 530 570, 470 570, 405 520" fill="none" stroke="#ef4444" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrow-crimson)"/>
  <rect x="440" y="555" width="220" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="550" y="571" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">⚠️ BUG-ORD-01: Backend cho phép chuyển!</text>
</svg>
